<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1630" width="900" height="1630" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MetSiteScanner decision workflow</title>
  <defs>
    <style>
      text { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
      .b { font-weight: bold; }
      .lbl { font-size: 12px; font-weight: bold; text-anchor: start; }
      .yes { fill: #2e7d32; }
      .no { fill: #c0392b; }
      .note { font-size: 11px; font-style: italic; fill: #666; text-anchor: start; }
      .proc { fill: #eef4ff; stroke: #4a6fa5; stroke-width: 1.5; }
      .dec { fill: #fff8e1; stroke: #c79100; stroke-width: 1.5; }
      .rej { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
      .io { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; }
      .arr { stroke: #555; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .ln { stroke: #555; stroke-width: 1.6; fill: none; }
      .rarr { stroke: #c0392b; stroke-width: 1.6; fill: none; marker-end: url(#ahr); }
      .loop { fill: none; stroke: #999; stroke-width: 1.3; stroke-dasharray: 6 5; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="900" height="1630" fill="#ffffff"/>

  <!-- loop frame (per donor combination) -->
  <rect class="loop" x="262" y="632" width="376" height="550" rx="10"/>
  <text class="note" x="270" y="646">repeat for every combination</text>

  <!-- START -->
  <rect class="io" x="250" y="20" width="400" height="56" rx="28"/>
  <text x="450" y="45" class="b">Input: Protein.pdb + mode + METAL+CN</text>
  <text x="450" y="63">MetSiteScanner.py Protein.pdb --mono Cu4</text>
  <path class="arr" d="M450,76 L450,110"/>

  <!-- D1 metal known -->
  <polygon class="dec" points="450,110 620,155 450,200 280,155"/>
  <text x="450" y="152">Metal in table?</text>
  <text x="450" y="169">(Cu Zn Fe Co Ni)</text>
  <path class="rarr" d="M620,155 L700,155"/>
  <text class="lbl no" x="646" y="146">no</text>
  <rect class="rej" x="700" y="130" width="180" height="50" rx="6"/>
  <text x="790" y="151">Stop with error</text>
  <text x="790" y="168">unknown metal</text>
  <path class="arr" d="M450,200 L450,234"/>
  <text class="lbl yes" x="460" y="222">yes</text>

  <!-- P2 CN check -->
  <rect class="proc" x="290" y="234" width="320" height="56" rx="6"/>
  <text x="450" y="257" class="b">Check CN against typical range</text>
  <text x="450" y="275">outside range = warning only</text>
  <path class="arr" d="M450,290 L450,324"/>

  <!-- P3 donors -->
  <rect class="proc" x="290" y="324" width="320" height="70" rx="6"/>
  <text x="450" y="346" class="b">Collect donors</text>
  <text x="450" y="364">His HIE-ND1, HID-NE2, N-terminal N</text>
  <text x="450" y="382">(HIP skipped; --no-nterm drops N-term)</text>
  <path class="arr" d="M450,394 L450,428"/>

  <!-- D2 enough donors -->
  <polygon class="dec" points="450,428 620,473 450,518 280,473"/>
  <text x="450" y="470">Enough donors?</text>
  <text x="450" y="487">≥ CN  (≥ 1 with --upto)</text>
  <path class="rarr" d="M620,473 L700,473"/>
  <text class="lbl no" x="646" y="464">no</text>
  <rect class="rej" x="700" y="448" width="180" height="50" rx="6"/>
  <text x="790" y="469">Skip this mode</text>
  <text x="790" y="486">not enough donors</text>
  <path class="arr" d="M450,518 L450,552"/>
  <text class="lbl yes" x="460" y="540">yes</text>

  <!-- P4 neighbours -->
  <rect class="proc" x="290" y="552" width="320" height="70" rx="6"/>
  <text x="450" y="574" class="b">For each donor, gather neighbours</text>
  <text x="450" y="592">within --don-cutoff (7 Å)</text>
  <text x="450" y="610">keep closest --max-neighbors (10)</text>
  <path class="arr" d="M450,622 L450,656"/>

  <!-- P5 combos -->
  <rect class="proc" x="290" y="656" width="320" height="56" rx="6"/>
  <text x="450" y="679" class="b">Build donor combinations</text>
  <text x="450" y="697">CN donors  (1..CN with --upto)</text>
  <path class="arr" d="M450,712 L450,746"/>

  <!-- D3 donor-donor -->
  <polygon class="dec" points="450,746 620,791 450,836 280,791"/>
  <text x="450" y="788">Donor–donor distances</text>
  <text x="450" y="805">all ≤ 7 Å?</text>
  <path class="rarr" d="M620,791 L700,791"/>
  <text class="lbl no" x="646" y="782">no</text>
  <rect class="rej" x="700" y="766" width="180" height="50" rx="6"/>
  <text x="790" y="787">Discard</text>
  <text x="790" y="804">combination</text>
  <path class="arr" d="M450,836 L450,870"/>
  <text class="lbl yes" x="460" y="858">yes</text>

  <!-- P6 fit -->
  <rect class="proc" x="290" y="870" width="320" height="56" rx="6"/>
  <text x="450" y="893" class="b">Fit metal position</text>
  <text x="450" y="911">ideal M–N = 2.00 Å (Cu)</text>
  <path class="arr" d="M450,926 L450,960"/>

  <!-- D4 max M-N -->
  <polygon class="dec" points="450,960 620,1005 450,1050 280,1005"/>
  <text x="450" y="1002">Longest M–N bond</text>
  <text x="450" y="1019">≤ ideal + 0.6 Å?</text>
  <path class="rarr" d="M620,1005 L700,1005"/>
  <text class="lbl no" x="646" y="996">no</text>
  <rect class="rej" x="700" y="980" width="180" height="50" rx="6"/>
  <text x="790" y="1001">Discard</text>
  <text x="790" y="1018">combination</text>
  <path class="arr" d="M450,1050 L450,1084"/>
  <text class="lbl yes" x="460" y="1072">yes</text>

  <!-- D5 clash -->
  <polygon class="dec" points="450,1084 620,1129 450,1174 280,1129"/>
  <text x="450" y="1126">Clash-free?</text>
  <text x="450" y="1143">no other atom &lt; 1.8 Å</text>
  <path class="rarr" d="M620,1129 L700,1129"/>
  <text class="lbl no" x="646" y="1120">no</text>
  <rect class="rej" x="700" y="1104" width="180" height="50" rx="6"/>
  <text x="790" y="1125">Discard</text>
  <text x="790" y="1142">combination</text>
  <path class="arr" d="M450,1174 L450,1208"/>
  <text class="lbl yes" x="460" y="1196">yes</text>

  <!-- P7 score -->
  <rect class="proc" x="290" y="1208" width="320" height="56" rx="6"/>
  <text x="450" y="1231" class="b">Score = distance fit + angle deviation</text>
  <text x="450" y="1249">rank all survivors (lower = better)</text>

  <!-- split -->
  <path class="ln" d="M450,1264 L450,1290"/>
  <path class="ln" d="M240,1290 L660,1290"/>
  <path class="arr" d="M240,1290 L240,1310"/>
  <path class="arr" d="M660,1290 L660,1310"/>

  <!-- mono -->
  <rect class="proc" x="60" y="1310" width="360" height="100" rx="6"/>
  <text x="240" y="1332" class="b">--mono : pick best sites</text>
  <text x="240" y="1352">best score first</text>
  <text x="240" y="1370">each donor used only once</text>
  <text x="240" y="1388">metals ≥ 2 × ideal M–N apart</text>

  <!-- di -->
  <rect class="proc" x="480" y="1310" width="360" height="150" rx="6"/>
  <text x="660" y="1332" class="b">--di : pick best pairs</text>
  <text x="660" y="1352">pair up the top 400 candidates</text>
  <text x="660" y="1370">M–M distance inside --sep window</text>
  <text x="660" y="1388">max 1 shared donor (bridge, small bonus)</text>
  <text x="660" y="1406">--no-bridge : no shared donor at all</text>
  <text x="660" y="1424">metals ≥ 3 Å from already kept metals</text>
  <text x="660" y="1442">no donor reused across pairs</text>

  <!-- merge -->
  <path class="ln" d="M240,1410 L240,1480"/>
  <path class="ln" d="M660,1460 L660,1480"/>
  <path class="ln" d="M240,1480 L660,1480"/>
  <path class="arr" d="M450,1480 L450,1500"/>

  <!-- output -->
  <rect class="io" x="170" y="1500" width="560" height="110" rx="10"/>
  <text x="450" y="1522" class="b">Write output PDB</text>
  <text x="450" y="1542">Protein_CU4_mono.pdb  |  _di.pdb  |  _both.pdb</text>
  <text x="450" y="1560">metals as HETATM CU, residue numbers 9001+</text>
  <text x="450" y="1578">REMARK lines: donors, distances, score</text>
  <text x="450" y="1596">--both : mono + di merged, duplicates &lt; 0.05 Å removed</text>
</svg>
